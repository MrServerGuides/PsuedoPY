name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal PsuedoPY source
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PsuedoPY version
      placeholder: Output of psuedopy --version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full diagnostic output
      render: text
