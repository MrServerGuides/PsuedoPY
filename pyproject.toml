[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psuedopy"
version = "2.0.0"
description = "A typed pseudocode language with C++-style expressions and a Python backend."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENCE"]
authors = [{name = "MrServerGuides"}]
keywords = ["pseudocode", "language", "compiler", "transpiler", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "tomli>=2.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/MrServerGuides/PsuedoPY"
Documentation = "https://github.com/MrServerGuides/PsuedoPY/tree/main/docs"
Issues = "https://github.com/MrServerGuides/PsuedoPY/issues"
Source = "https://github.com/MrServerGuides/PsuedoPY"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[project.scripts]
psuedopy = "psuedopy.cli:main"
pseudopy = "psuedopy.cli:main"
ppyx = "psuedopy.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["psuedopy*"]

[tool.setuptools.package-data]
psuedopy = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["psuedopy"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
